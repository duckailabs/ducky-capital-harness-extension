schemaVersion: 1
schema: openpond.runtime.manifest.v1
name: uniswap-routing-agent
version: 0.1.0
useCase: uniswap-routing-and-guarded-broadcast
description: "Build reviewable Uniswap routes and guard the broadcast of externally signed exact-match transactions."
runtime:
  base: node-bun-workspace
setup:
  commands:
    - "pnpm install --frozen-lockfile"
validation:
  commands:
    - "node -e \"require('@uniswap/smart-order-router')\""
    - "node -e \"require('@uniswap/sdk-core')\""
    - "node -e \"import('viem')\""
start:
  command: "openpond-agent run chat"
  timeoutSeconds: 60
  artifactPaths:
    []
  ports:
    []
actions:
  - id: chat
    name: chat
    label: Chat
    command: "openpond-agent run chat"
    timeoutSeconds: 60
    artifactPaths:
      []
    ports:
      []
  - id: quote-uniswap-swap
    name: quote-uniswap-swap
    label: "Quote Uniswap Swap"
    command: "openpond-agent run quote-uniswap-swap"
    timeoutSeconds: 300
    artifactPaths:
      - artifacts/uniswap-swap-plan.json
    ports:
      []
  - id: review-uniswap-plan
    name: review-uniswap-plan
    label: "Review Uniswap Plan"
    command: "openpond-agent run review-uniswap-plan"
    timeoutSeconds: 60
    artifactPaths:
      - artifacts/uniswap-plan-review.json
    ports:
      []
  - id: broadcast-uniswap-swap
    name: broadcast-uniswap-swap
    label: "Broadcast Uniswap Swap"
    command: "openpond-agent run broadcast-uniswap-swap"
    timeoutSeconds: 600
    artifactPaths:
      - artifacts/uniswap-broadcast-receipt.json
    ports:
      []
services:
  []
schedules:
  []
volumes:
  []
integrations:
  requiredLeases:
    []
permissions:
  {}
inputs:
  schema:
    type: object
    additionalProperties: true
    properties:
      prompt:
        type: string
      channel:
        type: string
  env:
    []
artifacts:
  paths:
    - artifacts/uniswap-swap-plan.json
    - artifacts/uniswap-plan-review.json
    - artifacts/uniswap-broadcast-receipt.json
network:
  egress: restricted
