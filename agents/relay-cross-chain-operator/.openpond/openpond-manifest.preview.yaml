schemaVersion: 1
schema: openpond.runtime.manifest.v1
name: relay-cross-chain-operator
version: 0.1.0
useCase: relay-cross-chain-routing-and-guarded-broadcast
description: "Quote Relay routes, review each cross-chain step, broadcast exact signed EVM steps, and monitor destination completion."
runtime:
  base: node-bun-workspace
setup:
  commands:
    - "pnpm install --frozen-lockfile"
validation:
  commands:
    - "node -e \"import('@relayprotocol/relay-sdk')\""
    - "node -e \"import('viem')\""
start:
  command: "openpond-agent run chat"
  timeoutSeconds: 60
  artifactPaths:
    []
  ports:
    []
actions:
  - id: chat
    name: chat
    label: Chat
    command: "openpond-agent run chat"
    timeoutSeconds: 60
    artifactPaths:
      []
    ports:
      []
  - id: quote-relay-transfer
    name: quote-relay-transfer
    label: "Quote Relay Transfer"
    command: "openpond-agent run quote-relay-transfer"
    timeoutSeconds: 180
    artifactPaths:
      - artifacts/relay-quote.json
    ports:
      []
  - id: review-relay-quote
    name: review-relay-quote
    label: "Review Relay Quote"
    command: "openpond-agent run review-relay-quote"
    timeoutSeconds: 60
    artifactPaths:
      - artifacts/relay-quote-review.json
    ports:
      []
  - id: relay-transfer-status
    name: relay-transfer-status
    label: "Relay Transfer Status"
    command: "openpond-agent run relay-transfer-status"
    timeoutSeconds: 120
    artifactPaths:
      - artifacts/relay-status.json
    ports:
      []
  - id: broadcast-relay-step
    name: broadcast-relay-step
    label: "Broadcast Relay Step"
    command: "openpond-agent run broadcast-relay-step"
    timeoutSeconds: 600
    artifactPaths:
      - artifacts/relay-step-receipt.json
    ports:
      []
services:
  []
schedules:
  []
volumes:
  []
integrations:
  requiredLeases:
    []
permissions:
  {}
inputs:
  schema:
    type: object
    additionalProperties: true
    properties:
      prompt:
        type: string
      channel:
        type: string
  env:
    - name: RELAY_API_KEY
      required: false
      secret: true
      description: "Optional server-side Relay API key stored in OpenPond secret storage."
artifacts:
  paths:
    - artifacts/relay-quote.json
    - artifacts/relay-quote-review.json
    - artifacts/relay-status.json
    - artifacts/relay-step-receipt.json
network:
  egress: restricted
