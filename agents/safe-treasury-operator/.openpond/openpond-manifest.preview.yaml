schemaVersion: 1
schema: openpond.runtime.manifest.v1
name: safe-treasury-operator
version: 0.1.0
useCase: safe-treasury-operations
description: "Inspect Safes, construct canonical multisig transactions, monitor confirmations, and publish externally signed proposals."
runtime:
  base: node-bun-workspace
setup:
  commands:
    - "pnpm install --frozen-lockfile"
validation:
  commands:
    - "node -e \"import('@safe-global/protocol-kit')\""
    - "node -e \"import('@safe-global/api-kit')\""
    - "node -e \"import('viem')\""
start:
  command: "openpond-agent run chat"
  timeoutSeconds: 60
  artifactPaths:
    []
  ports:
    []
actions:
  - id: chat
    name: chat
    label: Chat
    command: "openpond-agent run chat"
    timeoutSeconds: 60
    artifactPaths:
      []
    ports:
      []
  - id: inspect-safe
    name: inspect-safe
    label: "Inspect Safe"
    command: "openpond-agent run inspect-safe"
    timeoutSeconds: 120
    artifactPaths:
      - artifacts/safe-snapshot.json
    ports:
      []
  - id: build-safe-transaction
    name: build-safe-transaction
    label: "Build Safe Transaction"
    command: "openpond-agent run build-safe-transaction"
    timeoutSeconds: 180
    artifactPaths:
      - artifacts/safe-transaction-plan.json
    ports:
      []
  - id: safe-transaction-status
    name: safe-transaction-status
    label: "Safe Transaction Status"
    command: "openpond-agent run safe-transaction-status"
    timeoutSeconds: 120
    artifactPaths:
      - artifacts/safe-transaction-status.json
    ports:
      []
  - id: propose-safe-transaction
    name: propose-safe-transaction
    label: "Propose Safe Transaction"
    command: "openpond-agent run propose-safe-transaction"
    timeoutSeconds: 180
    artifactPaths:
      - artifacts/safe-proposal-receipt.json
    ports:
      []
services:
  []
schedules:
  []
volumes:
  []
integrations:
  requiredLeases:
    []
permissions:
  {}
inputs:
  schema:
    type: object
    additionalProperties: true
    properties:
      prompt:
        type: string
      channel:
        type: string
  env:
    - name: SAFE_API_KEY
      required: false
      secret: true
      description: "Optional Safe Transaction Service API key stored in OpenPond secret storage."
artifacts:
  paths:
    - artifacts/safe-snapshot.json
    - artifacts/safe-transaction-plan.json
    - artifacts/safe-transaction-status.json
    - artifacts/safe-proposal-receipt.json
network:
  egress: restricted
